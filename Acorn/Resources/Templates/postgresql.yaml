id: postgresql
name: PostgreSQL
category: Databases
image: postgres:17
summary: Reliable relational database for app development.
settings:
  - id: database
    type: string
    title: Database
    default: app
  - id: username
    type: string
    title: Username
    default: postgres
  - id: password
    type: password
    title: Password
    default: postgres
  - id: port
    type: integer
    title: Port
    default: 5432
runtime:
  ports:
    - host: "{{settings.port}}"
      container: 5432
  environment:
    POSTGRES_DB: "{{settings.database}}"
    POSTGRES_USER: "{{settings.username}}"
    POSTGRES_PASSWORD: "{{settings.password}}"
  volumes:
    - name: data
      path: /var/lib/postgresql/data
